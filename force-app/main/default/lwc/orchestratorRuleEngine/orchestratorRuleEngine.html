<template>
    <lightning-card title="Custom Metadata Orchestration Rules" icon-name="utility:settings" class="slds-m-bottom_medium">
        <div class="slds-p-horizontal_medium">
            <template if:true={rules.length}>
                <div class="slds-grid slds-gutters slds-wrap">
                    <template for:each={rules} for:item="rule">
                        <div key={rule.DeveloperName} class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_small">
                            <div class="rule-card">
                                <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                                    <span class="rule-title">{rule.MasterLabel}</span>
                                    <span class="slds-badge slds-theme_success">Active CMDT</span>
                                </div>
                                <div class="rule-detail-grid">
                                    <div><strong>Max Retries:</strong> {rule.Max_Retries__c}</div>
                                    <div><strong>SLA Window:</strong> {rule.SLA_Hours__c} hrs</div>
                                    <div><strong>Auto Retry:</strong> {rule.Auto_Retry__c}</div>
                                    <div><strong>Escalation:</strong> {rule.Escalation_Email__c}</div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
            <template if:false={rules.length}>
                <div class="slds-text-color_weak slds-text-align_center slds-p-around_small">
                    Loading Custom Metadata Rules...
                </div>
            </template>
        </div>
    </lightning-card>
</template>
